name: Release

# Runs when a merge to main changes package.json (every SDK update bumps the version there):
# publishes celitech-sdk to npm, then creates the tag v<version> and the GitHub release.
# Same flow as the Postman workflow it replaces. Kept out of Fern's regeneration by .fernignore.
on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: pkg
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${name}@${version} is already on npm; nothing to publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check NPM_TOKEN
        if: steps.pkg.outputs.published == 'false'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set"
            exit 1
          fi

      - name: Setup pnpm
        if: steps.pkg.outputs.published == 'false'
        uses: pnpm/action-setup@v4   # version taken from "packageManager" in package.json

      - name: Setup Node.js
        if: steps.pkg.outputs.published == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install and build
        if: steps.pkg.outputs.published == 'false'
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: Publish to npm
        if: steps.pkg.outputs.published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      # Runs after a successful publish, and also when the version was already on npm but its
      # release is missing (e.g. a previous run stopped half-way). Creates the tag with the release.
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pkg.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
